# POSTGRES SQL PGVECTOR
# =====================
 
spring.datasource.url=jdbc:postgresql://localhost:5432/
spring.datasource.username=
spring.datasource.password=

# spring.ai.ollama.embedding.options.dimensions=1024
# spring.ai.ollama.embedding.options.model=nomic-embed-text 

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# spring.ai.vectorstore.pgvector.dimension=1024
# spring.ai.vectorstore.pgvector.dimension=768
spring.ai.vectorstore.pgvector.dimension=1024
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false
spring.ai.vectorstore.pgvector.schema-name=public
# spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.table-name=vector_store

# spring.ai.ollama.embedding.options.dimensions=1024
spring.ai.ollama.embedding.options.model=nomic-embed-text 
